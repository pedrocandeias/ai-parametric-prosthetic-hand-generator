<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand Fab</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/theme.css">
    <style>
        :root {
            --text-primary: #030213; --text-secondary: #717182; --text-muted: #9b9bab;
            --border: #e5e5ea; --surface: #ffffff; --surface-2: #fafafa;
            --font: 'DM Sans', system-ui, sans-serif; --font-mono: 'DM Mono', monospace;
            --radius-sm: 8px;
        }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: var(--font); color: var(--text-primary); background: var(--surface); display: flex; flex-direction: column; min-height: 100vh; }

        .page-bar { border-bottom: 1px solid var(--border); }
        .page-bar-inner { max-width: 860px; margin: 0 auto; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .lang-switcher { appearance: none; -webkit-appearance: none; border: 1px solid var(--border); background: var(--surface); color: var(--text-secondary); font-family: var(--font); font-size: 0.8125rem; font-weight: 600; padding: 6px 10px; border-radius: var(--radius-sm); cursor: pointer; }
        .lang-switcher:hover { color: var(--text-primary); }
        .page-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .page-logo-icon { width: 32px; height: 32px; }
        .page-logo-text { font-size: 1.125rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
            background: linear-gradient(135deg, #a855f7 0%, #ec4899 50%, #f97316 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

        main { flex: 1; max-width: 860px; width: 100%; margin: 0 auto; padding: 40px 24px 56px; }
        .page-content h1 { font-size: 1.875rem; font-weight: 700; margin: 0 0 8px; }
        .page-content h2 { font-size: 1.375rem; font-weight: 600; margin: 32px 0 10px; }
        .page-content h3 { font-size: 1.125rem; font-weight: 600; margin: 24px 0 8px; }
        .page-content h4 { font-size: 1rem; font-weight: 600; margin: 20px 0 6px; }
        .page-content p { line-height: 1.7; color: var(--text-secondary); margin: 0 0 14px; }
        .page-content ul, .page-content ol { line-height: 1.7; color: var(--text-secondary); padding-left: 22px; margin: 0 0 14px; }
        .page-content li { margin-bottom: 4px; }
        .page-content a { color: #6366f1; }
        .page-content code { font-family: var(--font-mono); font-size: 0.85em; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
        .page-content pre { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px 16px; overflow-x: auto; }
        .page-content pre code { background: none; padding: 0; }
        .page-content blockquote { border-left: 3px solid var(--border); margin: 0 0 14px; padding: 4px 0 4px 16px; color: var(--text-muted); }
        .page-content hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }
        .page-meta { font-size: 0.75rem; color: var(--text-muted); margin-top: 40px; }
        .page-loading, .page-error { color: var(--text-muted); padding: 40px 0; }
        .page-error a { color: #6366f1; }

        /* Footer (shared styles, mirrors index.html) */
        .hf-footer-4col { padding: 32px 0 24px; border-top: 1px solid var(--border); }
        .hf-footer-4col-inner { max-width: 1280px; margin: 0 auto; padding: 0 24px; }
        .hf-footer-4col-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 32px; margin-bottom: 24px; }
        @media (max-width: 700px) { .hf-footer-4col-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 420px) { .hf-footer-4col-grid { grid-template-columns: 1fr; } }
        .hf-footer-4col-grid h3 { font-size: 0.875rem; font-weight: 600; margin: 0 0 12px; }
        .hf-footer-4col-grid > div > p { font-size: 0.8125rem; color: var(--text-muted); line-height: 1.6; margin: 0; }
        .hf-footer-4col-grid ul { list-style: none; padding: 0; margin: 0; }
        .hf-footer-4col-grid ul li { margin-bottom: 8px; }
        .hf-footer-4col-grid ul li a { font-size: 0.8125rem; color: var(--text-secondary); text-decoration: none; }
        .hf-footer-4col-grid ul li a:hover { color: var(--text-primary); }
        .hf-footer-copy { font-size: 0.75rem; color: var(--text-muted); text-align: center; padding-top: 8px; }
    </style>
</head>
<body>
    <div class="page-bar">
        <div class="page-bar-inner">
            <a href="/" class="page-logo">
                <svg class="page-logo-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs><linearGradient id="pg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#a855f7"/><stop offset="50%" stop-color="#ec4899"/><stop offset="100%" stop-color="#f97316"/></linearGradient></defs>
                    <rect x="38" y="15" width="8" height="52" rx="4" fill="url(#pg)"/>
                    <rect x="48" y="10" width="8" height="57" rx="4" fill="url(#pg)"/>
                    <rect x="58" y="15" width="8" height="52" rx="4" fill="url(#pg)"/>
                    <rect x="68" y="25" width="7" height="42" rx="3.5" fill="url(#pg)"/>
                    <path d="M35 65 L35 85 C35 88 37 90 40 90 L60 90 C63 90 65 88 65 85 L65 65 Z" fill="url(#pg)" opacity="0.9"/>
                </svg>
                <span class="page-logo-text">Hand Fab</span>
            </a>
            <select class="lang-switcher" data-i18n-aria-label="lang.label" aria-label="Language">
                <option value="en">EN</option>
                <option value="pt">PT</option>
            </select>
        </div>
    </div>

    <main>
        <article id="page-content" class="page-content">
            <p class="page-loading">Loading…</p>
        </article>
    </main>

    <footer class="hf-footer-4col" data-footer></footer>

    <script src="/translations.js"></script>
    <script src="/i18n.js"></script>
    <script src="/markdown.js"></script>
    <script src="/footer.js"></script>
    <script>
        const SLUG = decodeURIComponent(location.pathname.replace(/^\/pages\//, '').replace(/\/$/, ''));
        function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

        async function loadPage() {
            const el = document.getElementById('page-content');
            if (!SLUG) { el.innerHTML = `<p class="page-error">${t('page.noPage')}</p>`; return; }
            const lang = (window.I18n && I18n.getLang()) || 'en';
            try {
                const res = await fetch('/api/content/pages/' + encodeURIComponent(SLUG) + '?lang=' + encodeURIComponent(lang));
                if (!res.ok) {
                    el.innerHTML = `<p class="page-error">${t('page.notFound')} <a href="/">${t('page.goHome')}</a></p>`;
                    document.title = 'Hand Fab';
                    return;
                }
                const page = await res.json();
                document.title = page.title + ' — Hand Fab';
                const when = page.updated_at ? new Date(page.updated_at + 'Z').toLocaleDateString() : '';
                el.innerHTML = `<h1>${esc(page.title)}</h1>`
                    + window.renderMarkdown(page.body)
                    + (when ? `<p class="page-meta">${t('page.updated', { date: when })}</p>` : '');
            } catch {
                el.innerHTML = `<p class="page-error">${t('page.failed')}</p>`;
            }
        }

        if (document.readyState !== 'loading') loadPage();
        else document.addEventListener('DOMContentLoaded', loadPage);
        // Re-fetch the page (and footer re-renders itself) when the language changes.
        window.addEventListener('i18n:change', loadPage);
    </script>
</body>
</html>
